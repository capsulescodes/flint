name : Publish Package
on :
  release :
    types : [ published ]
jobs :
  build :
    runs-on : ubuntu-latest
    steps :
      - uses : actions/checkout@v4
      -  run : sh tests/runner.sh
      - uses : actions/setup-node@v4
        with :
          node-version : '22.x'
      - run : npm run test
